server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El worker de MapLibre se empaqueta como .mjs (dist/assets/maplibre-gl-worker-*.mjs), pero el
    # mapa de tipos MIME por defecto de nginx no trae esa extension - la serviria como
    # application/octet-stream. MapLibre crea ese worker con {type: "module"}, y el navegador
    # rechaza silenciosamente un worker-modulo cuyo script no llega con un Content-Type de
    # JavaScript real: el mapa queda sin calles (solo fondo y marcadores) sin ningun error visible
    # en la UI. default_type aqui fuerza el tipo correcto solo para estos archivos.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (React Router): cualquier ruta cae en index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
