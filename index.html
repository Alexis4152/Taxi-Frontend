<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#14171F" />
    <title>NexoraTaxis</title>
    <script>
      // Aplica el tema guardado antes de que cargue React, para no mostrar un flash de modo claro
      // y luego saltar a oscuro (ver ThemeContext.jsx, misma clave de localStorage).
      (function () {
        try {
          if (localStorage.getItem('nexora-theme') === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
